<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Southern Campaign Atlas</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>

  <!-- Header -->
  <header id="title-bar">
    <button id="toggle-sidebar" class="icon-btn" title="Commanders" aria-label="Toggle commanders panel">☰</button>
    <div>
      <h1>The Southern Campaign</h1>
      <p class="subtitle">American Revolution · Dec 1778 – Oct 1781</p>
    </div>
  </header>

  <!-- Commander sidebar -->
  <aside id="sidebar" class="panel">
    <div class="panel-head">
      <h2>Commanders</h2>
      <div class="head-actions">
        <button id="show-all" class="link-btn">All</button>
        <button id="show-none" class="link-btn">None</button>
      </div>
    </div>
    <div id="isolate-banner" hidden>
      <span>Isolating <strong id="isolate-name"></strong></span>
      <button id="clear-isolate" class="link-btn">Show everyone</button>
    </div>
    <label class="check-row small"><input type="checkbox" id="only-active" checked> Only list commanders in the field on this date</label>
    <div id="commander-list"></div>
    <div id="legend"></div>
  </aside>

  <!-- Layer switcher -->
  <div id="layer-panel" class="panel">
    <div class="seg" role="radiogroup" aria-label="Base map">
      <button data-layer="satellite" class="active">3D Satellite</button>
      <button data-layer="period">Period Maps</button>
      <button data-layer="modern">Modern</button>
    </div>
    <div class="check-pair">
      <label class="check-row"><input type="checkbox" id="terrain-toggle" checked> 3D terrain</label>
      <label class="check-row"><input type="checkbox" id="tilt-toggle" checked> Tilted view</label>
    </div>
    <label class="check-row"><input type="checkbox" id="full-trails"> Show full trails (otherwise last 30 days, fading)</label>
    <label class="check-row"><input type="checkbox" id="future-toggle"> Show routes ahead (dashed)</label>
    <label class="check-row"><input type="checkbox" id="landmark-toggle" checked> Camps &amp; posts</label>
    <label class="check-row"><input type="checkbox" id="dispatch-toggle-on" checked> Dispatches log during playback</label>
    <div id="period-opacity-row" hidden>
      <label for="period-opacity">Period map opacity</label>
      <input type="range" id="period-opacity" min="0" max="100" value="85">
      <div id="period-map-list"></div>
    </div>
  </div>

  <!-- Battle / commander / landmark info panel -->
  <aside id="info-panel" class="panel" hidden>
    <button id="close-info" class="icon-btn close" aria-label="Close">✕</button>
    <div id="info-content"></div>
  </aside>

  <!-- Play-mode notifications -->
  <div id="battle-card" class="battle-card" role="status" aria-live="polite" hidden></div>
  <section id="dispatches" class="panel" aria-label="Dispatches" hidden>
    <div class="d-head">
      <button id="dispatch-toggle" class="d-title" title="Show / hide the log">Dispatches <span id="dispatch-count">0</span> <span class="chev">▾</span></button>
      <button id="dispatch-clear" class="link-btn">Clear</button>
    </div>
    <ol id="dispatch-list" aria-live="polite"></ol>
  </section>

  <!-- Timeline -->
  <footer id="timeline" class="panel">
    <div class="tl-top">
      <div class="tl-controls">
        <button id="prev-battle" class="icon-btn" title="Previous battle (Shift+←)">⏮</button>
        <button id="prev-day" class="icon-btn" title="Previous day (←)">◀</button>
        <button id="play" class="icon-btn play" title="Play / pause (Space)">▶</button>
        <button id="next-day" class="icon-btn" title="Next day (→)">▶</button>
        <button id="next-battle" class="icon-btn" title="Next battle (Shift+→)">⏭</button>
        <select id="speed" title="Playback speed">
          <option value="1">1 day/s</option>
          <option value="4" selected>4 days/s</option>
          <option value="10">10 days/s</option>
          <option value="30">30 days/s</option>
        </select>
      </div>
      <div class="tl-date">
        <div id="date-label">—</div>
        <div id="date-sub"></div>
      </div>
      <label class="check-row small-row" title="Stop playback when a battle begins"><input type="checkbox" id="pause-battles"> Pause at battles</label>
      <input type="date" id="date-jump" aria-label="Jump to date">
    </div>
    <div class="tl-track">
      <div id="battle-ticks"></div>
      <input type="range" id="slider" min="0" max="100" value="0" aria-label="Date">
      <div id="year-labels"></div>
    </div>
    <details id="day-log">
      <summary>Events on this day <span id="event-count"></span></summary>
      <ul id="event-list"></ul>
    </details>
  </footer>

  <!-- Battlefield (tactical) view controls; replaces the timeline while a battle is open -->
  <footer id="tac-bar" class="panel" hidden>
    <div class="tac-top">
      <button id="tac-exit" class="btn" title="Back to the campaign map (Esc)">← Campaign map</button>
      <div class="tac-head">
        <div id="tac-title"></div>
        <div id="tac-clock">—</div>
      </div>
      <div class="tl-controls">
        <button id="tac-first" class="icon-btn" title="First phase">⏮</button>
        <button id="tac-prev" class="icon-btn" title="Previous phase (←)">◀</button>
        <button id="tac-play" class="icon-btn play" title="Play / pause (Space)">▶</button>
        <button id="tac-next" class="icon-btn" title="Next phase (→)">▶</button>
        <button id="tac-view" class="icon-btn" title="Reset the view">⌖</button>
      </div>
    </div>
    <div id="tac-dots" aria-label="Phases"></div>
    <div id="tac-caption" aria-live="polite"></div>
    <div id="tac-src"></div>
  </footer>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="data/places.js"></script>
  <script src="data/commanders.js"></script>
  <script src="data/movements.js"></script>
  <script src="data/battles.js"></script>
  <script src="data/landmarks.js"></script>
  <script src="data/historic-maps.js"></script>
  <script src="data/tactical/cowpens.js"></script>
  <script src="data/tactical/guilford.js"></script>
  <script src="data/tactical/kings_mountain.js"></script>
  <script src="data/tactical/camden.js"></script>
  <script src="data/tactical/eutaw.js"></script>
  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/movements.js"></script>
  <script src="js/commanders.js"></script>
  <script src="js/battles.js"></script>
  <script src="js/tactical.js"></script>
  <script src="js/landmarks.js"></script>
  <script src="js/toasts.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
